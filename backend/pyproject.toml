[project]
name = "smartenglish-prep-backend"
version = "0.1.0"
description = "Optional enhancement server for SmartEnglish-Prep"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
